[platformio]
boards_dir = boards

; ============================================================================
; ENTORNO PRINCIPAL - Sin BLE (v3.x)
; ============================================================================
[env:esp32dev]
platform = espressif32@5.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Librerías necesarias
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8

; Configuración de compilación
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_ARDUINO_USB_CDC_ON_BOOT=0
    -DPLATFORMIO=1
    -DA2_FEATURE_WIFI_MGMT=1
    -DA2_FEATURE_GSM_MODEM=0
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; Configuración de monitor
monitor_filters =
    default
    time

; ============================================================================
; ENTORNO A2 + 4G - A2 clásico con módulo SIM en el socket (GSM Fase 1: estado)
; ============================================================================
[env:esp32dev_4g]
platform = espressif32@5.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_ARDUINO_USB_CDC_ON_BOOT=0
    -DPLATFORMIO=1
    -DA2_FEATURE_WIFI_MGMT=1
    -DA2_FEATURE_GSM_MODEM=1
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

monitor_filters =
    default
    time

; ============================================================================
; ENTORNO BLE - Con NimBLE para configuración móvil (v4.x)
; ============================================================================
[env:esp32dev_ble]
platform = espressif32@5.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Partición personalizada con más espacio (1.875 MB por app)
board_build.partitions = partitions_ble.csv

; Librerías necesarias (incluye NimBLE)
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.0

; Configuración de compilación
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_ARDUINO_USB_CDC_ON_BOOT=0
    -DPLATFORMIO=1
    -DENABLE_BLE=1
    -DA2_FEATURE_WIFI_MGMT=1
    -DA2_FEATURE_GSM_MODEM=0
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; Configuración de monitor
monitor_filters = 
    default
    time
; ============================================================================
; ENTORNO A2v3 - ESP32-S3 N16R8 + W5500 + SIM7600E + DS3231 + SSD1306 (Fase 2)
;   Requiere una vez por máquina: python3 scripts/bootstrap_pio_s3_platform.py
;   (crea .pio-kincony-platform desde espressif32@6.8.1 + Arduino core 3.0.7)
; ============================================================================
[env:esp32dev_s3]
platform = file://${PROJECT_DIR}/.pio-kincony-platform
board = kincony_kc868_a2v3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_size = 16MB
; NVS de 128 KB: en core 3.x la EEPROM emulada vive en NVS y los 20 KB del
; default_16MB.csv provocan fallos intermitentes de commit (verificado en placa)
board_build.partitions = partitions_s3_16MB.csv
board_build.arduino.memory_type = qio_opi

platform_packages = 
    framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.0.7/esp32-3.0.7.zip
    framework-arduinoespressif32-libs@https://github.com/espressif/esp32-arduino-lib-builder/releases/download/idf-release_v5.1/esp32-arduino-libs-idf-release_v5.1-632e0c2a.zip
    espressif/toolchain-xtensa-esp32s3@12.2.0+20230208

lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPLATFORMIO=1
    -DA2_BOARD_A2V3=1
    -DA2_FEATURE_WIFI_MGMT=1
    -DA2_FEATURE_GSM_MODEM=1
    -DA2_FEATURE_LCD=1
    -DA2_FEATURE_RTC=1
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

monitor_filters = 
    default
    time
