; ============================================================================
; ENTORNO PRINCIPAL - Sin BLE (v3.x)
; ============================================================================
[env:esp32dev]
platform = espressif32@5.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Librerías necesarias
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8

; Configuración de compilación
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_ARDUINO_USB_CDC_ON_BOOT=0
    -DPLATFORMIO=1
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; Configuración de monitor
monitor_filters = 
    default
    time

; ============================================================================
; ENTORNO BLE - Con NimBLE para configuración móvil (v4.x)
; ============================================================================
[env:esp32dev_ble]
platform = espressif32@5.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Partición personalizada con más espacio (1.875 MB por app)
board_build.partitions = partitions_ble.csv

; Librerías necesarias (incluye NimBLE)
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.0

; Configuración de compilación
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_ARDUINO_USB_CDC_ON_BOOT=0
    -DPLATFORMIO=1
    -DENABLE_BLE=1
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; Configuración de monitor
monitor_filters = 
    default
    time